name: "Restore or build native addons"
description: >
   Reuses source-matched shipping addons between snapshot builds.
   Cache misses build each target sequentially and preserve target directories
   under ci-natives. Hosted cache misses restore Bazel action/download caches.
   Only main writes caches, keeping two entries per scope and cache kind.

inputs:
   targets:
      description: Space-separated natives-* Bazel target names
      required: true
   cache-scope:
      description: Cache prefix shared by jobs producing the same target set
      required: true

runs:
   using: composite
   steps:
      - name: Compute native addon cache key
        id: key
        shell: bash
        env:
           CACHE_SCOPE: ${{ inputs.cache-scope }}
           NATIVE_TARGETS: ${{ inputs.targets }}
           RUNNER_OS: ${{ runner.os }}
           RUNNER_ARCH: ${{ runner.arch }}
           TOOLCHAIN_HASH: ${{ hashFiles('.bazelversion', 'rust-toolchain.toml', 'MODULE.bazel', 'MODULE.bazel.lock', '.bazelrc', 'bazel/defs.bzl', 'bazel/toolchains/**') }}
           DOWNLOAD_INPUTS_HASH: ${{ hashFiles('Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml') }}
           NATIVE_INPUTS_HASH: ${{ hashFiles('Cargo.toml', 'Cargo.lock', 'MODULE.bazel', 'MODULE.bazel.lock', 'rust-toolchain.toml', 'rustfmt.toml', '.bazelrc', '.bazelignore', '.bazelversion', 'bazel/**', 'crates/**', 'BUILD.bazel') }}
        run: |
           set -euo pipefail
           echo "prefix=${CACHE_SCOPE}-v1-" >> "$GITHUB_OUTPUT"
           echo "key=${CACHE_SCOPE}-v1-${NATIVE_INPUTS_HASH}" >> "$GITHUB_OUTPUT"
           # Separate runner OS/architecture/image family and target sets.
           # Bazel action keys also hash tool inputs, including host tools;
           # image patch updates need not discard all cached Rust actions.
           target_hash="$(printf %s "$NATIVE_TARGETS" | sha256sum | cut -d' ' -f1)"
           compatibility="${RUNNER_OS}-${RUNNER_ARCH}-${ImageOS:-unknown}-${target_hash}-${TOOLCHAIN_HASH}"
           disk_prefix="${CACHE_SCOPE}-bazel-disk-v1-${compatibility}-"
           downloads_prefix="${CACHE_SCOPE}-bazel-downloads-v1-${compatibility}-"
           echo "disk-prefix=$disk_prefix" >> "$GITHUB_OUTPUT"
           echo "disk-key=${disk_prefix}${NATIVE_INPUTS_HASH}" >> "$GITHUB_OUTPUT"
           echo "downloads-prefix=$downloads_prefix" >> "$GITHUB_OUTPUT"
           echo "downloads-key=${downloads_prefix}${DOWNLOAD_INPUTS_HASH}" >> "$GITHUB_OUTPUT"

      - name: Restore native addons
        id: restore
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
           path: ci-natives
           key: ${{ steps.key.outputs.key }}

      - name: Report native addon source
        shell: bash
        env:
           EXACT: ${{ steps.restore.outputs.cache-hit }}
           MATCHED: ${{ steps.restore.outputs.cache-matched-key }}
        run: |
           if [ "$EXACT" = true ]; then
             echo "Using source-matched native addons ($MATCHED); no Bazel build needed."
           else
             echo "No source-matched native addon cache; building from this checkout."
           fi

      - id: bazel-cache
        if: steps.restore.outputs.cache-hit != 'true'
        uses: ./.github/actions/bazel-cache

      - name: Restore Bazel disk action cache
        id: disk-restore
        if: steps.bazel-cache.outputs.local-cache == 'true'
        continue-on-error: true
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
           path: ${{ steps.bazel-cache.outputs.cache-dir }}/disk
           key: ${{ steps.key.outputs.disk-key }}
           # Older source snapshots are safe only for content-addressed actions,
           # never for the shipping .node addon cache above.
           restore-keys: ${{ steps.key.outputs.disk-prefix }}

      - name: Restore Bazel and xwin downloads
        id: downloads-restore
        if: steps.bazel-cache.outputs.local-cache == 'true'
        continue-on-error: true
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
           # repository_cache holds Bazel's checked downloads; xwin's ~1 GiB
           # Microsoft CDN payload is not covered by that cache.
           path: ${{ steps.bazel-cache.outputs.cache-dir }}/downloads
           key: ${{ steps.key.outputs.downloads-key }}
           restore-keys: ${{ steps.key.outputs.downloads-prefix }}

      - name: Build native addons
        if: steps.restore.outputs.cache-hit != 'true'
        shell: bash
        env:
           NATIVE_TARGETS: ${{ inputs.targets }}
           OMP_BAZEL_RC: ${{ steps.bazel-cache.outputs.rc }}
        run: |
           set -eo pipefail
           if [ "$(ulimit -Sn)" != unlimited ] && [ "$(ulimit -Sn)" -lt 65536 ]; then ulimit -Sn 65536 || true; fi
           # Addon links peak at several GiB RSS; keep links sequential
           # within each platform build.
           read -r -a targets <<< "$NATIVE_TARGETS"
           for target in "${targets[@]}"; do
             bazelisk --bazelrc="$OMP_BAZEL_RC" build "//:$target" 2>&1 | tee "$RUNNER_TEMP/bazel-build.log"
             summary=$(sed -E 's/\x1b\[[0-9;]*m//g' "$RUNNER_TEMP/bazel-build.log" | grep -E '[0-9]+ processes:' | tail -1 || true)
             echo "::notice title=$target Bazel build summary::${summary:-no process summary found}"
             mkdir -p "ci-natives/$target"
             cp -L bazel-bin/"$target"/*.node "ci-natives/$target/"
           done

      - name: Report local Bazel cache sizes
        if: steps.bazel-cache.outputs.local-cache == 'true'
        continue-on-error: true
        shell: bash
        env:
           CACHE_DIR: ${{ steps.bazel-cache.outputs.cache-dir }}
        run: du -sh "$CACHE_DIR/disk" "$CACHE_DIR/downloads"

      - name: Save Bazel disk action cache
        if: github.ref == 'refs/heads/main' && steps.bazel-cache.outputs.local-cache == 'true' && steps.disk-restore.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
           path: ${{ steps.bazel-cache.outputs.cache-dir }}/disk
           key: ${{ steps.key.outputs.disk-key }}

      - name: Save Bazel and xwin downloads
        if: github.ref == 'refs/heads/main' && steps.bazel-cache.outputs.local-cache == 'true' && steps.downloads-restore.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
           # Unlike action snapshots, downloads do not get recopied for every
           # Rust source edit; their key changes only with dependency inputs.
           path: ${{ steps.bazel-cache.outputs.cache-dir }}/downloads
           key: ${{ steps.key.outputs.downloads-key }}

      - name: Save native addon cache entry
        if: github.ref == 'refs/heads/main' && steps.restore.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
           path: ci-natives
           key: ${{ steps.key.outputs.key }}

      - name: Prune superseded native cache entries
        if: github.ref == 'refs/heads/main' && steps.restore.outputs.cache-hit != 'true'
        continue-on-error: true
        shell: bash
        env:
           GH_TOKEN: ${{ github.token }}
           PREFIX: ${{ steps.key.outputs.prefix }}
           LOCAL_CACHE: ${{ steps.bazel-cache.outputs.local-cache }}
           DISK_PREFIX: ${{ steps.key.outputs.disk-prefix }}
           DOWNLOADS_PREFIX: ${{ steps.key.outputs.downloads-prefix }}
        run: |
           # Keep two snapshots per compatible cache kind. Disk snapshots can
           # be large; GitHub's repository quota and age-based eviction still
           # apply, and obsolete toolchain/image prefixes age out there.
           prefixes=("$PREFIX")
           if [ "$LOCAL_CACHE" = true ]; then
             prefixes+=("$DISK_PREFIX" "$DOWNLOADS_PREFIX")
           fi
           for prefix in "${prefixes[@]}"; do
             gh cache list --repo "$GITHUB_REPOSITORY" --ref refs/heads/main --key "$prefix" \
                 --sort created_at --order desc --limit 100 --json id --jq '.[2:][].id' \
               | while read -r id; do
                   gh cache delete "$id" --repo "$GITHUB_REPOSITORY" || true
                 done
           done
